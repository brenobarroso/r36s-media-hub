# MPV Input Configuration for R36S Media Hub
# Mappings for keyboard emulation (via gptokeyb) and direct gamepad events

# Exit immediately
q quit
ESC quit
b quit
tab quit
BS quit
DEL quit

# Playback controls
SPACE cycle pause
ENTER cycle pause
KP_ENTER cycle pause

# Seeking
LEFT seek -10
RIGHT seek 10
UP seek 60
DOWN seek -60
PGUP seek 300
PGDWN seek -300

# Playlist controls
e playlist-next
< playlist-prev
> playlist-next

# Volume
a add volume 5
d add volume -5
+ add volume 5
- add volume -5
m cycle mute

# Direct Linux Gamepad events (evdev)
GAMEPAD_B quit
GAMEPAD_BACK quit
GAMEPAD_START cycle pause
GAMEPAD_A cycle pause
GAMEPAD_DPAD_LEFT seek -10
GAMEPAD_DPAD_RIGHT seek 10
GAMEPAD_DPAD_UP seek 60
GAMEPAD_DPAD_DOWN seek -60
GAMEPAD_LEFT_SHOULDER playlist-prev
GAMEPAD_RIGHT_SHOULDER playlist-next

JOY_BTN_0 cycle pause
JOY_BTN_1 quit
JOY_BTN_2 quit
JOY_BTN_3 quit
JOY_BTN_START cycle pause
JOY_BTN_SELECT quit
JOY_BTN_BACK quit
JOY_UP seek 60
JOY_DOWN seek -60
JOY_LEFT seek -10
JOY_RIGHT seek 10
